
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MyApp</title>

    <style>
        
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #101828, #263b75, #5145a5);
}

/* Authentication Background */

.auth-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

/* Auth Card */

.auth-card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    padding: 40px;
    border-radius: 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.logo-box {
    width: 65px;
    height: 65px;
    background: linear-gradient(135deg, #5145a5, #8175ed);
    color: white;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 20px;
}

.auth-card h2 {
    font-weight: 700;
    color: #18213b;
}

.subtitle {
    color: #8a94a6;
    font-size: 14px;
}

/* Inputs */

.form-label {
    font-size: 14px;
    font-weight: 600;
    color: #344054;
}

.form-control {
    padding: 13px 15px;
    border: 1px solid #e0e4ec;
    border-radius: 10px;
    font-size: 14px;
}

.form-control:focus {
    border-color: #6658d3;
    box-shadow: 0 0 0 3px rgba(102, 88, 211, 0.12);
}

/* Button */

.btn-custom {
    background: linear-gradient(135deg, #5145a5, #8175ed);
    border: none;
    color: white;
    padding: 13px;
    border-radius: 10px;
    font-weight: 600;
    transition: 0.3s;
}

.btn-custom:hover {
    background: linear-gradient(135deg, #40358d, #6558d3);
    color: white;
    transform: translateY(-2px);
}

.auth-link {
    color: #6658d3;
    text-decoration: none;
    font-weight: 600;
}

.auth-link:hover {
    text-decoration: underline;
}

.divider {
    border-top: 1px solid #edf0f5;
    margin: 25px 0;
}

/* Dashboard */

.dashboard-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.dashboard-card {
    background: white;
    width: 100%;
    max-width: 650px;
    padding: 50px 35px;
    text-align: center;
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.dashboard-icon {
    width: 90px;
    height: 90px;
    background: #eeeaff;
    color: #6658d3;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: 0 auto 25px;
}

@media(max-width: 480px) {
    .auth-card {
        padding: 28px 22px;
    }

    .dashboard-card {
        padding: 35px 20px;
    }
}

    </style>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="logo-box">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <div class="text-center mb-4">
                <h2>Welcome Back!</h2>
                <p class="subtitle">Login to continue your journey</p>
            </div>

            <div id="message"></div>

            <form id="login-form">

                <div class="mb-3">
                    <label class="form-label">Email Address</label>

                    <input
                        type="email"
                        class="form-control"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="login-password"
                            placeholder="Enter your password"
                            required
                        >

                        <button class="btn btn-outline-secondary"
                            type="button"
                            id="toggle-login-password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-custom w-100">
                    Login <i class="bi bi-arrow-right ms-2"></i>
                </button>

            </form>

            <div class="divider"></div>

            <p class="text-center mb-0 subtitle">
                Don't have an account?
                <a href="signup.html" class="auth-link">Create Account</a>
            </p>

        </div>

    </div>

    <script type="module" src="./index.js"></script>

</body>
</html>
